# auto-label 路径映射表（actions/labeler 语法）
# 根据改动文件自动打标签；缺失标签会在 sync-labels: true 时自动创建。
# 适配 cgartlab-skills 仓库真实结构：Skill 目录索引仓库（skills.json + catalog 脚本）。
# 原则：type:bug 不参与路径推断（由 issue 模板承载），每个 label 至少命中一类真实文件。

📋 type:task:
  - changed-files:
      - any-glob-to-any-file:
          - 'skills.json'

📝 type:docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - 'LESSONS.md'
          - 'CHANGELOG.md'
          - '.agents/**'
          - '.claude/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/PULL_REQUEST_TEMPLATE.md'

🧪 area:scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'bin/**'
          - 'tests/**'

⚙️ area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.gitattributes'
          - '.gitignore'

🔖 priority:P0:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/*ci*'
          - '.github/workflows/*release*'
          - '.github/workflows/*skill-catalog*'
          - 'AGENTS.md'
          - 'SECURITY.md'

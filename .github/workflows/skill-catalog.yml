name: Skill Catalog

on:
  schedule:
    # Weekly: Sunday 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Manual trigger via GitHub UI
  repository_dispatch:
    types: [update-catalog]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update catalog
        run: bash bin/update-catalog.sh
        env:
          GH_TOKEN: ${{ secrets.SKILL_CATALOG_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit changes
        run: |
          git config user.name "skill-catalog-bot"
          git config user.email "bot@cgartlab.com"
          git add skills.json README.md
          git diff --cached --quiet || (git commit -m "chore(catalog): auto-update skill registry" && git push)
